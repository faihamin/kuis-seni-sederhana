<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuis Seni Tari</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="main-menu">
    <h1>Kuis Seni Tari</h1>
    <input type="text" id="player-name" placeholder="Masukkan Nama Anda" />
    <button onclick="startGame()">Mulai Kuis</button>
    <button onclick="showHighScores()">Lihat Skor Tertinggi</button>
    <button onclick="clearHighScores()">Hapus Data Skor</button>
  </div>

  <div id="quiz" class="hidden">
    <h2 id="question-text"></h2>
    <div id="answers"></div>
    <p id="feedback"></p>
    <button onclick="nextQuestion()">Soal Berikutnya</button>
  </div>

  <div id="score-screen" class="hidden">
    <h2>Skor Anda: <span id="final-score"></span></h2>
    <button onclick="returnToMenu()">Kembali ke Menu</button>
  </div>

  <div id="high-scores" class="hidden">
    <h2>Skor Tertinggi</h2>
    <ul id="score-list"></ul>
    <button onclick="returnToMenu()">Kembali ke Menu</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
